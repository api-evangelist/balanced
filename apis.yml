name: Balanced
description: Balanced was a payments API for online marketplaces and crowdfunding
  platforms, founded out of Y Combinator (W2011) and backed by Andreessen Horowitz
  (a16z), SV Angel, Collaborative Fund, and angels including Brian Chesky and Ashton
  Kutcher. It offered a developer-first API for processing cards and bank (ACH) payments,
  paying out to sellers, and handling seller identity/underwriting for marketplaces.
  Balanced announced on 2015-03-13 that it was shutting down its payments platform
  and gave customers 90 days notice, striking a transition deal that migrated card,
  bank account, and seller identity data to Stripe by 2015-06-11. The company and
  its API are defunct; the balancedpayments.com domain is now a parked/lander page
  and the api/docs hosts no longer resolve.
